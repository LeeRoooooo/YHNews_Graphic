name: Update YNA Graphic RSS Feed

on:
  # 2시간 간격 실행 (UTC 기준 매 짝수 시 0분)
  schedule:
    - cron: '0 */2 * * *'
  # GitHub 웹 화면에서 수동으로 'Run workflow' 버튼을 눌러 테스트할 수 있도록 활성화
  workflow_dispatch:

permissions:
  contents: write # 저장소에 feed.xml 커밋 및 푸시를 위한 쓰기 권한

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 환경 설정 (버전 3.11)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 패키지 다운로드 캐싱으로 실행 속도 단축

      # 3. requirements.txt 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Playwright 브라우저 엔진 및 실행 의존성 설치
      # --with-deps 옵션은 우분투 가상머신에 필요한 시스템 라이브러리를 함께 설치합니다.
      - name: Install Playwright Chromium with system dependencies
        run: |
          playwright install chromium --with-deps

      # 5. RSS 생성 스크립트 실행
      # 파이썬 파일명이 main.py가 아닐 경우 실제 스크립트 파일명으로 변경해 주세요.
      - name: Run RSS generator script
        run: |
          python main.py

      # 6. 변경된 feed.xml 파일 자동 커밋 및 푸시
      - name: Commit and push if feed updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add feed.xml
          # 변경 사항이 있을 때만 커밋 수행 (동일한 데이터일 때 에러 방지)
          if git diff --staged --quiet; then
            echo "피드에 변경 사항이 없습니다."
          else
            git commit -m "Auto-update: YNA Graphic RSS feed"
            git push
          fi
